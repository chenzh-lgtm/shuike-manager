# ============================================================
# CI — 持续集成
# 触发: push/PR 到 main 分支
# 任务: 后端编译+测试、前端编译
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ========== 后端编译 + 测试 ==========
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: shuike@2026
          MYSQL_DATABASE: shuike_manager
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pshuike@2026"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-

      - name: 初始化数据库 Schema
        run: |
          mysql -h 127.0.0.1 -u root -pshuike@2026 shuike_manager < docs/数据库/database.sql
          mysql -h 127.0.0.1 -u root -pshuike@2026 --default-character-set=utf8 shuike_manager < docs/数据库/prompt_data.sql

      - name: 编译 + 运行测试
        run: cd backend && mvn clean test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/shuike_manager?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: shuike@2026

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports/

  # ========== 前端编译 ==========
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖 + 编译
        run: |
          cd frontend
          npm ci --registry=https://registry.npmmirror.com
          npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
