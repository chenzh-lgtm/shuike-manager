# ============================================================
# CD — 持续部署
# 触发: 手动触发 或 push main 且 CI 通过
# 任务: 构建 Docker 镜像 → 推送阿里云 ACR → 部署到 ECS
# ============================================================
name: CD

on:
  workflow_dispatch:                          # 手动触发
  push:
    branches: [main]
    paths:                                    # 仅代码变更时触发
      - 'backend/src/**'
      - 'backend/pom.xml'
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - 'frontend/vite.config.ts'
      - 'frontend/nginx.conf'

env:
  ACR_REGISTRY: crpi-x4kb991wgxw0oamg.cn-hangzhou.personal.cr.aliyuncs.com
  BACKEND_IMAGE: crpi-x4kb991wgxw0oamg.cn-hangzhou.personal.cr.aliyuncs.com/shuike2026/teacher-file-manager-backend
  FRONTEND_IMAGE: crpi-x4kb991wgxw0oamg.cn-hangzhou.personal.cr.aliyuncs.com/shuike2026/teacher-file-manager-frontend

jobs:

  # ========== 构建 + 部署 ==========
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: shuike@2026
          MYSQL_DATABASE: shuike_manager
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pshuike@2026"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ==================== 后端 ====================
      - name: 设置 JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-cd-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-cd-

      - name: 初始化数据库 + 测试
        run: |
          mysql -h 127.0.0.1 -u root -pshuike@2026 shuike_manager < docs/数据库/database.sql
          mysql -h 127.0.0.1 -u root -pshuike@2026 --default-character-set=utf8 shuike_manager < docs/数据库/prompt_data.sql
          cd backend && mvn clean test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/shuike_manager?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: shuike@2026

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-x4kb991wgxw0oamg.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建 + 推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:1.0,${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==================== 前端 ====================
      - name: 设置 Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 构建 + 推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:1.0,${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==================== 部署到 ECS ====================
      - name: 部署到 ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          password: ${{ secrets.ECS_PASSWORD }}
          script: |
            set -e
            REGISTRY=crpi-x4kb991wgxw0oamg.cn-hangzhou.personal.cr.aliyuncs.com

            echo "=== 登录 ACR ==="
            echo "${{ secrets.ACR_PASSWORD }}" | docker login --username="${{ secrets.ACR_USERNAME }}" --password-stdin $REGISTRY

            echo "=== 拉取最新镜像 ==="
            cd /opt/shuike
            docker compose pull backend frontend

            echo "=== 重启服务 ==="
            docker compose up -d --no-deps backend frontend

            echo "=== 等待后端启动 ==="
            sleep 20

            echo "=== 验证 ==="
            docker ps --filter "name=shuike" --format "table {{.Names}}\t{{.Status}}"
            docker logs shuike-backend --tail 15
