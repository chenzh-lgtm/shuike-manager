server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shuike_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000

  redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.shuike.manager.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:shuike-manager-jwt-secret-key-2026-must-be-at-least-256-bits-long}
  access-token-expiration: 7200
  refresh-token-expiration: 604800

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: admin
  secret-key: passsword123456
  bucket: shuike-manager

volcano:
  api-key: ark-206f19bd-c75f-4243-8b65-def780c211f6-504f9
  endpoint: ${VOLCANO_ENDPOINT:https://ark.cn-beijing.volces.com/api/v3}
  default-model: ep-20260502165153-5zwf7
  temperature: 0.3

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
